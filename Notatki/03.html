<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O co tu chodzi</title>
</head>
<body>
    <script>
        const text1 = 'powiększ minie(zapisz wielkimi lierami)'; //
        const text2 = 'ZAPISZ MNIE MAŁYMI LITERAMI'; //
        const text3 = '$#%#^ wytnij te dziwne znaki na początku';//
        const text4 = 'Sprawdź, czy zawieram słowo "czy"?';
        const text5 = 'wyLoguj w konsoli tylko litere "L", która znajduje się w wyrazie "wyloguj"';//
        const text6 = 'pies zamień każde słowo pies na słowo kot pies'; //
        const text7 = 'podziel, ten, string, od, przecinków'
        //znajdź i zastosuj właściwe metody które zrobią to co jest napisane w stałych
        document.write(text1.toUpperCase() + "<br>" );
        document.write(text2.toLowerCase() + "<br>" );
        document.write(text3.slice(6) + "<br>"); // !!
        document.write(text4.includes("czy") + "<br>");
        console.log(text5.charAt(2));
        document.write(text6.replaceAll('pies', 'kot') + "<br>");
        document.write(text7.split(',') + "<br>"); //komentaż:  wiem jak to ma działać
    </script>
</body>
